name: schelling_base

data:
  system: schelling
  data_dir: GENERATED_DATA
  grid_size: 20
  schelling_patch_size: 2
  num_snapshots: 5
  train_frac: 0.8
  val_frac: 0.1
  held_out_fraction: 0.0

model:
  model_size: base
  dropout: 0.1
  positional_encoding: time_space

training:
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  epochs: 20
  label_smoothing: 0.05
  seed: 42
  device: cuda
  lr_scheduler: cosine
  warmup_epochs: 2
  checkpoint_dir: results/checkpoints
  save_every: 5
  log_dir: results/logs

conformal:
  enabled: true
  method: raps
  alpha_levels: [0.01, 0.05, 0.10, 0.20]
  k_reg: 5
  lambda_reg: 0.01
  cal_fraction: 0.5

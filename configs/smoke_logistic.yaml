name: smoke_logistic

data:
  system: logistic_map
  data_dir: GENERATED_DATA
  n_r_classes: 5
  logistic_window_T: 32
  quantize_bits: 8
  train_frac: 0.7
  val_frac: 0.15

model:
  model_size: tiny
  dropout: 0.1
  positional_encoding: time_space

training:
  batch_size: 64
  lr: 3.0e-4
  epochs: 3
  seed: 42
  device: cpu
  lr_scheduler: cosine
  warmup_epochs: 0
  checkpoint_dir: results/checkpoints
  log_dir: results/logs

conformal:
  enabled: true
  method: raps
  alpha_levels: [0.05, 0.10, 0.20]

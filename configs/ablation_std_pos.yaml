name: ablation_std_pos

data:
  data_dir: GENERATED_DATA
  lattice_width: 32
  patch_size: 8
  window_T: 32
  train_frac: 0.8
  val_frac: 0.1
  held_out_fraction: 0.0

model:
  model_size: base
  dropout: 0.1
  positional_encoding: standard

training:
  batch_size: 256
  lr: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  epochs: 20
  label_smoothing: 0.05
  seed: 42
  device: cuda
  lr_scheduler: cosine
  warmup_epochs: 2
  checkpoint_dir: results/checkpoints
  save_every: 5
  log_dir: results/logs
